<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Clarity.AI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      width: 280px;
      padding: 16px;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .header .subtitle {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .control-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    #toggleAudio {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #4CAF50;
      color: white;
    }

    #toggleAudio:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    #toggleAudio:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .mode-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    .mode-label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #streamMode {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      cursor: pointer;
    }

    #streamMode:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tags-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      backdrop-filter: blur(10px);
      min-height: 60px;
    }

    .tags-label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #tag-list {
      max-height: 120px;
      overflow-y: auto;
    }

    .tag {
      display: inline-block;
      margin: 2px 4px 2px 0;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      text-align: center;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      transition: all 0.2s ease;
    }

    .tag:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .tag.selected {
      background: rgba(76, 175, 80, 0.8);
      border-color: #4CAF50;
    }

    .status {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .processing-indicator {
      display: none;
      text-align: center;
      margin: 8px 0;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
    }

    .processing-indicator.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Scrollbar styling */
    #tag-list::-webkit-scrollbar {
      width: 4px;
    }

    #tag-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    #tag-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }

    #tag-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>

<body>
  <div class="header">
    <h2>Clarity.AI</h2>
    <div class="subtitle">Real-time Audio Separation</div>
  </div>

  <div class="control-section">
    <button id="toggleAudio">Start Audio Processing</button>
    <div class="processing-indicator" id="processingIndicator">
      <span class="spinner"></span>Processing audio...
    </div>
  </div>

  <div class="mode-section">
    <div class="mode-label">Audio Mode</div>
    <select id="streamMode">
      <option value="accompaniment">🎵 Music Only</option>
      <option value="vocals">🎤 Vocals Only</option>
    </select>
  </div>

  <div class="tags-section">
    <div class="tags-label">Detected Sounds</div>
    <div id="tag-list">
      <div style="color: rgba(255,255,255,0.6); font-style: italic; font-size: 11px;">
        Start processing to detect sounds
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
